<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Population by Shape</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">

        <link rel="stylesheet" href="styles.css">
    </head>

    <input id="searchBox" 
        type="text" 
        placeholder="Search for a city or country..." 
        autocomplete="off"
        name="no-autofill"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        style="
            position:absolute;
            top:10px; left:270px;
            z-index:3000;
            padding:6px 10px;
            background: #f7f7f7;
            border:2px solid #bebebe;
            border-radius:4px;
            width:240px;
        ">

    <div id="searchResults"
        style="
            position:absolute;
            top:46px; left:270px;
            width:260px;
            max-height:300px;
            background:#f7f7f7;
            border:2px solid #bebebe;
            border-radius:4px;
            z-index:3000;
            display:none;
        ">
    </div>

    <body>

        <button id="sidebarButton" aria-label="Toggle sidebar"></button>

        <div id="container">
            <div id="map"></div>

            <div id="sidebar" aria-hidden="true">
                <div class="sidebar-inner">
                    <h2>Population by Shape on a Map</h2>
                    <p>Use the tools on the left to draw a shape & find the population of those living inside.</p>
                    <p>Calculation Mode: </p>
                    <div id="speedcontroller" style="display:flex;">
                        
                        <label style="display:block; cursor:pointer;">
                            <input type="radio" name="speedMode" value="fast" checked>
                            Fast
                        </label>

                        <label style="display:block; cursor:pointer;">
                            <input type="radio" name="speedMode" value="exact">
                            Exact
                        </label>
                    </div>
                    <br><br>

                    <div id="shapeList"></div>
                </div>
            </div>
        </div>

        <script src="main.js" defer></script>
    </body>
</html>
