<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Population by Shape</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">

        <style>
            :root
            {
                --color-bg: #d5dceb;
                --color-bg-border: #0c214e;
                --color-highlight: #cdd6e9;
            }

            body, html, div, input, button, h1, h2, h3, p
            {
                font-family: "Inter", sans-serif;
            }
            html,body
            {
                height:100%;
                margin:0;
                overflow:hidden;
            }

            #container
            {
                position:relative;
                display:flex;
                height:100%;
                width:100%;
            }

            #map
            {
                flex:1 1 auto;
                height:100%;
                transition: width 0.2s ease;
                min-width: 0;
            }

            #sidebar
            {
                width: 0%;
                background: var(--color-bg);
                height:100%;
                overflow:hidden;
                transition: width 0.2s ease, padding 0.2s ease;
                box-sizing:border-box;
                padding:0;

                border-left: 2px solid var(--color-bg-border);
            }

            #sidebarButton
            {
                position: absolute;
                top: 50%;
                right: 0%;
                z-index: 3000;
                background: var(--color-bg);

                border-right: 4px solid var(--color-bg);
                border-left: 2px solid var(--color-bg-border);
                border-top: 2px solid var(--color-bg-border);
                border-bottom: 2px solid var(--color-bg-border);

                padding: 8px 10px;
                cursor: pointer;
                border-radius: 4px;
                transition: right 0.2s ease;
                transform: translate(8%, -50%);
                display:flex;
                align-items:center;
                justify-content:center;
                width:48px;
                height:196px;
                font-size:16px;
                line-height:1;

            }

            

            .sidebar-inner
            {
                padding:15px;
                box-sizing:border-box;
            }

            #searchResults
            {
                font-family: "Inter", Arial, sans-serif;
                font-size: inherit;
            }

            .search-result-item
            {
                font-family: inherit;
                font-size: 14px;
                padding: 8px 10px;
                cursor: pointer;
                border-bottom: 1px solid #eee;
                background: #f7f7f7;
                transition: background 0.2s ease;
            }

            .search-result-item:hover
            {
                background: #cdd6e9;
            }


            /* Zoom control container */
            .leaflet-control-zoom a
            {
                transition: background 0.2s, transform 0.2s;
            }
            .leaflet-control-zoom a:hover
            {
                background-color: var(--color-highlight);
            }

            /* Draw control container */
            .leaflet-draw .leaflet-bar a
            {
                transition: background 0.2s, transform 0.2s;
            }
            .leaflet-draw .leaflet-bar a:hover
            {
                background-color: var(--color-highlight);
            }

            .shape-item
            {
                margin-bottom: 8px;
                background: #ffffff;
                border-radius: 4px;
                overflow: hidden;
                cursor: pointer;
                transition: background-color 0.15s ease;
            }

            .shape-header
            {
                padding: 8px 10px;
                font-weight: 500;
                display: flex;
                align-items: center;
                gap: 8px;
                background: rgba(0, 0, 0, 0.05);
                transition: background-color 0.15s ease;
            }

            .shape-color
            {
                width: 12px;
                height: 12px;
                border-radius: 2px;
            }

            .shape-details
            {
                padding: 0 10px;
                font-size: 14px;
                overflow: hidden;

                max-height: 0;
                opacity: 0;
                background: rgba(0, 0, 0, 0.00);

                transition:
                    background-color 0.15s ease,
                    max-height 0.15s ease,
                    opacity 0.1s ease,
                    padding 0.15s ease;
            }

            .shape-item.highlight
            {
                background: color-mix(in srgb, var(--shape-color) 20%, white);
            }

            .shape-item.highlight .shape-details
            {
                background: color-mix(in srgb, var(--shape-color) 12%, white);
            }

            .shape-item.open .shape-details
            {
                padding: 8px 10px;

                max-height: 200px;
                opacity: 1;
            }

            .shape-title
            {
                flex: 1;
            }

            .shape-arrow
            {
                font-size: 12px;
                transition: transform 0.15s;
            }

            .shape-item.open .shape-arrow
            {
                transform: rotate(180deg); /* ▼ → ▲ */
            }

            .leaflet-interactive {
                transition: fill-opacity 0.15s ease;
            }

        </style>

    </head>

    <input id="searchBox" 
        type="text" 
        placeholder="Search for a city or country..." 
        autocomplete="off"
        name="no-autofill"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        style="
            position:absolute;
            top:270px; left:10px;
            z-index:3000;
            padding:6px 10px;
            background: #f7f7f7;
            border:2px solid #bebebe;
            border-radius:4px;
            width:240px;
        ">

    <div id="searchResults"
     style="
         position:absolute;
         top:302px; left:10px;
         width:260px;
         max-height:300px;
         background:#f7f7f7;
         border:2px solid #bebebe;
         border-radius:4px;
         z-index:3000;
         display:none;
     ">
    </div>

    <body>

        <button id="sidebarButton" aria-label="Toggle sidebar"></button>

        <div id="container">
            <div id="map"></div>

            <div id="sidebar" aria-hidden="true">
                <div class="sidebar-inner">
                    <h2>Population by Shape on a Map</h2>
                    <p>Use the tools on the left to draw a shape & find the population of those living inside.</p>
                    <p>Calculation Mode: </p>
                    <div id="speedcontroller" style="display:flex;">
                        
                        <label style="display:block; cursor:pointer;">
                            <input type="radio" name="speedMode" value="fast" checked>
                            Fast
                        </label>

                        <label style="display:block; cursor:pointer;">
                            <input type="radio" name="speedMode" value="exact">
                            Exact
                        </label>
                    </div>
                    <br><br>

                    <div id="shapeList"></div>
                </div>
            </div>
        </div>

        <script>
            // DOM references
            const sidebar = document.getElementById('sidebar');
            const mapDiv = document.getElementById('map');
            const toggleBtn = document.getElementById('sidebarButton');
            let sidebarOpen = true;
            toggleBtn.textContent = '▶';
            const SIDEBAR_WIDTH = '30%';

            const shapes = new Map();
            let shapeCounter = 1;

            const COLOR_PALETTE =
            [
                "#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f",
                "#edc949", "#af7aa1", "#ff9da7", "#9c755f", "#bab0ab",

                "#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd",
                "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf",

                "#6a3d9a", "#b15928", "#33a02c", "#fb9a99", "#e31a1c",
                "#1f78b4", "#a6cee3", "#b2df8a", "#cab2d6", "#ffff99",

                "#8dd3c7", "#ffffb3", "#bebada", "#fb8072", "#80b1d3",
                "#fdb462", "#b3de69", "#fccde5", "#d9d9d9", "#bc80bd",

                "#ccebc5", "#ffed6f"
            ];

            let nextColorIndex = 0;

            function getNextColor()
            {
                const c = COLOR_PALETTE[nextColorIndex % COLOR_PALETTE.length];
                nextColorIndex++;
                return c;
            }

            // Initialize map
            const map = L.map('map').setView([-37.8136, 144.9631], 11);

            // Initialise layer/s
            var CartoDB_VoyagerNoLabels = L.tileLayer
            (
                'https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',
                {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 20
                }
            );

            var Esri_WorldGrayCanvas = L.tileLayer
            (
                'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                {
                    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
                    maxZoom: 16
                }
            );


            var CartoDB_PositronOnlyLabels = L.tileLayer
            (
                'https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',
                {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                    subdomains: 'abcd',
                    maxZoom: 20
                }
            );

            Esri_WorldGrayCanvas.addTo(map)
            CartoDB_PositronOnlyLabels.addTo(map);
        

            // Folium-like Draw controls
            const drawnItems = new L.FeatureGroup();
            map.addLayer(drawnItems);
            
            const drawControl = new L.Control.Draw
            (
                {
                    edit:
                    {
                        featureGroup: drawnItems
                    },
                    draw:
                    {
                        polygon: true,  
                        rectangle: true,
                        circle: false,
                        polyline: false,
                        marker: false,
                        circlemarker: false
                    }
                }
            );
            map.addControl(drawControl);


            //Functionality to Call AWS Lambda Backend
            map.on(L.Draw.Event.CREATED, async function (event) {
                const layer = event.layer;
                const id = shapeCounter++;
                const color = getNextColor();

                layer.setStyle({
                    color,
                    weight: 4,
                    fillOpacity: 0.2
                });

                drawnItems.addLayer(layer);

                try {
                    const response = await fetch(
                        "https://njsg367vql.execute-api.ap-southeast-4.amazonaws.com/hello",
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                polygon: layer.toGeoJSON().geometry,
                                speed: document.querySelector(
                                    'input[name="speedMode"]:checked'
                                ).value
                            })
                        }
                    );

                    const data = await response.json();

                    // --- Create sidebar dropdown ---
                    const item = document.createElement("div");
                    item.className = "shape-item";

                    item.innerHTML = `
                        <div class="shape-header">
                            <div class="shape-color" style="background:${color}"></div>
                            <span class="shape-title">Shape ${id}</span>
                            <span class="shape-arrow">▼</span>
                        </div>
                        <div class="shape-details">
                            <p><b>Population:</b> ${Math.round(data.population).toLocaleString()}</p>
                            <p><b>Mode:</b> ${data.speed}</p>
                            <p><b>Time:</b> ${data.time} ms</p>
                        </div>
                    `;
                    item.style.setProperty("--shape-color", color);

                    document.getElementById("shapeList").appendChild(item);

                    // --- Store shape ---
                    shapes.set(id, { layer, item });

                    // --- Hover sync: shape → sidebar ---
                    layer.on("mouseover", () => {
                        layer.setStyle({fillOpacity: 0.4 });
                        item.classList.add("highlight");
                    });

                    layer.on("mouseout", () => {
                        layer.setStyle({fillOpacity: 0.2 });
                        item.classList.remove("highlight");
                    });

                    // --- Hover sync: sidebar → shape ---
                    item.addEventListener("mouseover", () => {
                        layer.setStyle({ fillOpacity: 0.4 });
                        item.classList.add("highlight");
                    });

                    item.addEventListener("mouseout", () => {
                        layer.setStyle({ fillOpacity: 0.2 });
                        item.classList.remove("highlight");
                    });

                    // --- Toggle dropdown ---
                    item.querySelector(".shape-header").addEventListener("click", () => {
                        item.classList.toggle("open");
                    });

                } catch (err) {
                    console.error("Population error:", err);
                }
            });


        
            sidebar.style.transition = 'none';
            toggleBtn.style.transition = 'none';

            sidebar.style.width = SIDEBAR_WIDTH;
            toggleBtn.style.right = SIDEBAR_WIDTH;

            toggleBtn.addEventListener('click', () =>
            {
                sidebar.style.transition = '';
                toggleBtn.style.transition = '';

                sidebarOpen = !sidebarOpen;

                if (sidebarOpen) // If Sidebar is to be opened
                {
                    sidebar.style.width = SIDEBAR_WIDTH;
                    sidebar.setAttribute('aria-hidden', 'false');
                }
                else // If Sidebar is to be closed:
                {
                    sidebar.style.width = '0';
                    sidebar.setAttribute('aria-hidden', 'true');

                }

                toggleBtn.style.right = sidebarOpen ? SIDEBAR_WIDTH : '0';
                toggleBtn.textContent = sidebarOpen ? '▶' : '◀';

            });

            async function searchLocation(query)
            {
                const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}`;

                try
                {
                    const response = await fetch(url);
                    const data = await response.json();
                    const results = data.features;

                    const searchResultsDiv = document.getElementById("searchResults");
                    searchResultsDiv.innerHTML = "";

                    if (!results || !results.length)
                    {
                        searchResultsDiv.style.display = "none";
                        return;
                    }

                    // VALID TYPES: Cities + States + Countries
                    const VALID_TYPES = new Set
                    ([
                        "city",
                        "town",
                        "village",
                        "hamlet",
                        "municipality",
                        "locality",

                        "state",
                        "province",
                        "region",
                        "county",

                        "country"
                    ]);

                    const filtered = results.filter(f =>
                        VALID_TYPES.has(f.properties.osm_value)
                    );

                    filtered.slice(0, 7).forEach
                    (feature =>
                        {
                            const props = feature.properties;
                            const coords = feature.geometry.coordinates; // [lon, lat]

                            // Choose best name
                            const mainName =
                                props.name ||
                                props.city ||
                                props.state ||
                                props.country ||
                                "(unknown)";

                            // Build clean label
                            const label = [
                                mainName,
                                props.state,
                                props.country
                            ].filter(Boolean).join(", ");

                            const item = document.createElement("div");
                            item.className = "search-result-item";
                            item.textContent = label;

                            item.addEventListener
                            ("click", () =>
                                {
                                    const lon = coords[0];
                                    const lat = coords[1];

                                    map.setView([lat, lon], 10);

                                    L.marker([lat, lon])
                                        .addTo(map)
                                        .bindPopup(label)
                                        .openPopup();

                                    searchResultsDiv.style.display = "none";
                                }
                            );

                            searchResultsDiv.appendChild(item);
                        }
                    );
                    searchResultsDiv.style.display = "block";
                }
                catch (err)
                {
                    alert("Search error: " + err);
                }
            }

            document.getElementById("searchBox").addEventListener
            (
                "keydown", (e) =>
                {
                    if (e.key === "Enter")
                    {
                        const query = document.getElementById("searchBox").value.trim();
                        if (query) searchLocation(query);
                    }
                }
            );


            let debounceTimer = null;

            function debounceSearch(query)
            {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout
                (() =>
                    {
                        if (query.length >= 1)
                        {
                            searchLocation(query);
                        }
                        else
                        {
                            document.getElementById("searchResults").style.display = "none";
                        }
                    }, 250
                );
            }

            document.getElementById("searchBox").addEventListener
            ("input", () =>
                {
                    const query = document.getElementById("searchBox").value.trim();
                    debounceSearch(query);
                }
            );

            document.addEventListener("click", (e) => {
                const box = document.getElementById("searchBox");
                const drop = document.getElementById("searchResults");

                if (!box.contains(e.target) && !drop.contains(e.target)) {
                    drop.style.display = "none";
                }
            });

        </script>
    </body>
</html>
