<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Population by Shape</title>

        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">

        <link rel="stylesheet" href="styles.css">
    </head>

    <input id="searchBox" 
        type="text" 
        placeholder="Search for a city or country..." 
        autocomplete="off"
        name="no-autofill"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        style="
            position:absolute;
            top:10px; left:270px;
            z-index:3000;
            padding:6px 10px;
            background: #f7f7f7;
            border:2px solid #bebebe;
            border-radius:4px;
            width:240px;
        ">

    <div id="searchResults"
        style="
            position:absolute;
            top:46px; left:270px;
            width:260px;
            max-height:300px;
            background:#f7f7f7;
            border:2px solid #bebebe;
            border-radius:4px;
            z-index:3000;
            display:none;
        ">
    </div>

    <body>

        <button id="sidebarButton" aria-label="Toggle sidebar"></button>

        <div id="container">
            <div id="map"></div>

            <div id="sidebar" aria-hidden="true">
                <div class="sidebar-inner">

                    <!-- PERSISTENT HEADER -->
                    <div class="sidebar-header">
                        <h2>Population Inside a Shape on a Map</h2>
                    </div>

                    <!-- TABS -->
                    <div class="sidebar-tabs">
                        <button class="tab active" data-tab="shapes">Shapes</button>
                        <button class="tab" data-tab="settings">Settings</button>
                    </div>

                    <!-- TAB CONTENT -->
                    <div class="sidebar-panels">

                        <!-- SHAPES TAB -->
                        <div class="tab-panel active" id="tab-shapes">
                            <div id="emptyState" class="empty-state">
                                <p><b>No shapes yet</b></p>
                                <p>Draw a shape on the map (using the tools to the left of your screen) to calculate population.</p>

                                <button id="addSampleShapesBtn">
                                    Create example shapes
                                </button>
                            </div>

                            <div id="shapeList"></div>
                        </div>

                        <!-- SETTINGS TAB -->
                        <div class="tab-panel" id="tab-settings">

                            <div class="settings-container">

                                <!-- A) GLOBAL ACTIONS BAR -->
                                <div class="settings-actions">
                                    <div class="settings-action">
                                        <button class="settings-btn danger delete-all-btn">
                                            Delete All Shapes
                                        </button>

                                        <div class="delete-confirm delete-all-confirm">
                                            <span>Are you sure?</span>
                                            <button class="confirm-yes">✓</button>
                                        </div>
                                    </div>

                                    <div class="settings-action">
                                        <button class="settings-btn reset-map-btn">
                                            Reset Map Position
                                        </button>
                                    </div>

                                    <div class="settings-action">
                                        <button class="settings-btn reset-settings-btn">
                                            Reset All Settings
                                        </button>
                                    </div>
                                </div>

                                <!-- B) CORE SETTINGS AREA -->
                                <div class="settings-main">

                                    <!-- LEFT COLUMN -->
                                    <div class="settings-left">

                                        <!-- Calculation Mode -->
                                        <section class="settings-section">
                                            <h3>Calculation Mode</h3>

                                            <div class="radio-group">
                                                <label class="radio-option">
                                                    <input type="radio" name="calcMode" value="fast" checked>
                                                    <span>Fast</span>
                                                    <span class="info-icon">i</span>
                                                </label>

                                                <label class="radio-option">
                                                    <input type="radio" name="calcMode" value="exact">
                                                    <span>Exact</span>
                                                    <span class="info-icon">i</span>
                                                </label>
                                            </div>

                                            <p class="settings-help">
                                                Fast mode prioritises speed over precision using reduced tile depth.
                                            </p>
                                        </section>

                                        <!-- Units -->
                                        <section class="settings-section">
                                            <h3>Area Units</h3>

                                            <div class="radio-group">
                                                <label class="radio-option">
                                                    <input type="radio" name="units" value="km2" checked>
                                                    km²
                                                </label>
                                                <label class="radio-option">
                                                    <input type="radio" name="units" value="mi2">
                                                    mi²
                                                </label>
                                                <label class="radio-option">
                                                    <input type="radio" name="units" value="ha">
                                                    hectares
                                                </label>
                                            </div>
                                        </section>

                                        <!-- Confirm Delete -->
                                        <section class="settings-section">
                                            <h3>Confirm Delete</h3>

                                            <div class="radio-group">
                                                <label class="radio-option">
                                                    <input type="radio" name="confirmDelete" value="true">
                                                    Enabled
                                                </label>

                                                <label class="radio-option">
                                                    <input type="radio" name="confirmDelete" value="false" checked>
                                                    Disabled
                                                </label>
                                            </div>
                                        </section>

                                    </div>

                                    <!-- RIGHT COLUMN -->
                                    <div class="settings-right">

                                        <!-- Map Type -->
                                        <section class="settings-section">
                                            <h3>Map Type</h3>

                                            <div class="radio-group vertical map-type-group">

                                                <label class="radio-option map-type-option">
                                                    <input type="radio" name="mapType" value="vector_carto" checked>
                                                    <span class="map-type-label">Carto</span>
                                                    <div class="map-preview vector1"></div>
                                                </label>

                                                <label class="radio-option map-type-option">
                                                    <input type="radio" name="mapType" value="vector_osm">
                                                    <span class="map-type-label">OSM</span>
                                                    <div class="map-preview vector2"></div>
                                                </label>

                                                <label class="radio-option map-type-option">
                                                    <input type="radio" name="mapType" value="satellite">
                                                    <span class="map-type-label">Satellite</span>
                                                    <div class="map-preview satellite"></div>
                                                </label>

                                                <label class="radio-option map-type-option">
                                                    <input type="radio" name="mapType" value="terrain">
                                                    <span class="map-type-label">Terrain</span>
                                                    <div class="map-preview terrain"></div>
                                                </label>

                                                <label class="radio-option map-type-option">
                                                    <input type="radio" name="mapType" value="dark">
                                                    <span class="map-type-label">Dark</span>
                                                    <div class="map-preview dark"></div>
                                                </label>

                                            </div>
                                        </section>


                                    </div>
                                </div>

                                <!-- C) RESERVED FUTURE SECTION -->
                                <div class="settings-footer">
                                    <!-- intentionally empty for now -->
                                </div>

                            </div>

                        </div>

                    </div>
                </div>

            </div>
        </div>

        <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
        <script src="main.js" defer></script>
    </body>
</html>
