AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Python 3.11 ZIP-based Lambda with GDAL (lambgeo-built)

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 1024
    Architectures:
      - x86_64

Resources:
  HelloWorldFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.app.lambda_handler
      CodeUri: dist/package.zip

      Environment:
        Variables:
          GDAL_DISABLE_READDIR_ON_OPEN: "YES"
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: ".tif,.tiff,.ovr"
          GDAL_NUM_THREADS: "ALL_CPUS"
          CPL_LOG: "/dev/null"
          GDAL_DATA: "/var/task/share/gdal"
          PROJ_LIB: "/var/task/share/proj"

      Events:
        HelloWorld:
          Type: HttpApi
          Properties:
            Path: /hello
            Method: post

      Policies:
        - S3ReadPolicy:
            BucketName: population-cog20

Outputs:
  HelloWorldApi:
    Description: "API Gateway endpoint URL"
    Value: !GetAtt ServerlessHttpApi.ApiEndpoint
